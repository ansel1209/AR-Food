<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AR 食物菜單</title>

    <!-- 載入 Google Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

</head>


<body>

    <h1>AR 食物菜單</h1>

    <h2>牛肉漢堡</h2>

    <p>價格：$280</p>

  <model-viewer
    src="models/cupNoodle.glb"
    ar
    ar-modes="quick-look"
    camera-controls
    shadow-intensity="1"
    ar-scale="fixed"
    alt="牛肉漢堡">

    <button slot="ar-button" id="ar-button">
        📱 放到桌上看看
    </button>

    </model-viewer>

     <h2>泡麵</h2>

    <p>價格：$50</p>

    
    <model-viewer
    src="models/cupNoodle.glb"
    ar
    ar-modes="quick-look"
    camera-controls
    shadow-intensity="1"
    ar-scale="fixed"
    alt="泡麵">

    <button slot="ar-button" id="ar-button2">
        📱 放到桌上看看
    </button>
    
    </model-viewer>

</body>

</html>
